    <style>
        /* Классический строгий стиль */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f5f7; /* Мягкий серый фон страницы */
            color: #333333;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff; /* Белый фон для блока с меню */
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); /* Легкая тень */
        }
        
        h1 {
            text-align: center;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 25px;
            color: #2c3e50;
            font-weight: 600;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 15px;
        }
        
        .menu-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .menu-item {
            margin-bottom: 12px;
        }
        
        /* Стили кнопок-ссылок */
        .menu-link {
            display: block;
            padding: 15px 20px;
            background-color: #ffffff;
            color: #2d3748;
            text-decoration: none;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            font-size: 16px;
            transition: all 0.2s ease;
        }
        
        .menu-link:hover {
            /* Подсветка при наведении */
            background-color: #ebf4ff;
            border-color: #bee3f8;
            color: #2b6cb0;
        }
    </style>
